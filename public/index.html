<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7f9;--ink:#14181f;--muted:#5b6573;--line:#d9dde3;--link:#1b4fd8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--ink:#e6e9ee;--muted:#98a2b0;--line:#272d36;--link:#7da2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1rem/1.6 'Newsreader',Georgia,serif}
main{max-width:56rem;margin:0 auto;padding:3.5rem 1.25rem 3rem}
h1{font-size:2.4rem;line-height:1.15;font-weight:600;margin:0 0 .75rem;letter-spacing:-.01em}
p{margin:0 0 1rem}
.muted{color:var(--muted)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:6px;padding:.3rem .9rem;cursor:pointer}
button:hover,button[aria-pressed=true]{border-color:var(--ink)}
#tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:1.5rem 1.1rem}
.cover{display:block;aspect-ratio:3/4;width:100%;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:4px;background:var(--line)}
.ph{display:grid;place-items:center;font-size:3rem;color:var(--muted)}
.t{display:block;margin-top:.5rem;line-height:1.3;font-size:1rem}
.tag{font-size:.85rem;color:var(--muted)}
a:hover .t{color:var(--link)}
.del{border:0;padding:0;color:var(--muted);font-size:.9rem}
input,select,textarea{background:transparent;border:1px solid var(--line);border-radius:6px;padding:.45rem .7rem;width:100%;margin-bottom:.6rem}
select option{color:#000}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
#owner{max-width:30rem;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--line)}
footer{margin-top:3rem;font-size:.95rem}
footer button{border:0;padding:0;color:var(--muted)}
textarea{min-height:7rem;resize:vertical}
h2{font-size:1.4rem;font-weight:600;margin:0 0 .5rem}
#ask{max-width:30rem;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.m{border-top:1px solid var(--line);padding:.8rem 0}
.hp{position:absolute;left:-9999px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Free Library</h1>
  <p class="muted">Free books on cyber security and programming. Open any title and read it in your browser. No account needed.</p>

  <div id="tabs"></div>
  <div id="grid"><p class="muted">Loading books…</p></div>

  <section id="ask">
    <h2>Can't find a book?</h2>
    <p class="muted">Tell me which book you're looking for and how to reach you, and I'll try to add it.</p>
    <form id="msgform">
      <input type="text" id="mn" placeholder="Your name (optional)" maxlength="80">
      <input type="text" id="mc" placeholder="Your email or WhatsApp number" maxlength="120" required>
      <textarea id="mm" placeholder="Book title or your message" maxlength="2000" required></textarea>
      <input type="text" id="mw" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button>Send message</button>
      <span id="mstat" class="muted" role="status"></span>
    </form>
  </section>

  <section id="owner" hidden>
    <form id="login">
      <p>Owner login</p>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <button>Log in</button>
    </form>
    <form id="up" hidden>
      <p>Add a book</p>
      <select id="cat" aria-label="Category">
        <option value="cybersecurity">Cyber Security</option>
        <option value="programming">Programming</option>
      </select>
      <input type="text" id="title" placeholder="Book title" required>
      <input type="file" id="file" accept="application/pdf" required>
      <button>Upload book</button>
      <button type="button" id="out">Log out</button>
    </form>
    <div id="inbox"></div>
    <p id="msg" class="muted" role="status"></p>
  </section>

  <footer><button id="toggle">Owner</button></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const CATS = { all: 'All', cybersecurity: 'Cyber Security', programming: 'Programming' };
let token = localStorage.getItem('token') || '', books = [], cat = 'all';
const say = (t) => { $('msg').textContent = t; };

function tabs() {
  $('tabs').replaceChildren(...Object.entries(CATS).map(([k, v]) => {
    const b = document.createElement('button');
    b.textContent = v; b.setAttribute('aria-pressed', k === cat);
    b.onclick = () => { cat = k; tabs(); draw(); };
    return b;
  }));
}

function draw() {
  const g = $('grid'), list = books.filter((b) => cat === 'all' || b.category === cat);
  g.replaceChildren();
  if (!list.length) { g.innerHTML = '<p class="muted">No books here yet. Check back soon.</p>'; return; }
  for (const b of list) {
    const card = document.createElement('div');
    const a = document.createElement('a');
    a.href = b.url; a.target = '_blank'; a.rel = 'noopener';
    let pic;
    if (b.cover) { pic = document.createElement('img'); pic.src = b.cover; pic.alt = ''; pic.loading = 'lazy'; pic.className = 'cover'; }
    else { pic = document.createElement('div'); pic.className = 'cover ph'; pic.textContent = b.title[0]; }
    const t = document.createElement('span'); t.className = 't'; t.textContent = b.title;
    a.append(pic, t);
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = CATS[b.category];
    card.append(a, tag);
    if (token) {
      const d = document.createElement('button');
      d.className = 'del'; d.textContent = ' · Delete';
      d.onclick = async () => {
        if (!confirm('Delete "' + b.title + '"?')) return;
        const x = await fetch('/api/books?path=' + encodeURIComponent(b.path), { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
        say(x.ok ? 'Deleted.' : 'Could not delete. Log in again.'); load();
      };
      card.append(d);
    }
    g.append(card);
  }
}

async function load() {
  try {
    const r = await fetch('/api/books');
    books = await r.json();
    if (!r.ok) throw new Error(books.error);
    draw();
  } catch (e) { $('grid').innerHTML = '<p class="muted">Could not load books. Refresh to try again.</p>'; }
}

async function makeCover(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await pdf.getPage(1);
  const vp = page.getViewport({ scale: 420 / page.getViewport({ scale: 1 }).width });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.8));
}

function show() { $('login').hidden = !!token; $('up').hidden = !token; inbox(); }

async function inbox() {
  const box = $('inbox'); box.replaceChildren();
  if (!token) return;
  const r = await fetch('/api/messages', { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) return;
  const list = await r.json();
  const h = document.createElement('p'); h.textContent = 'Messages (' + list.length + ')'; box.append(h);
  for (const m of list) {
    const d = document.createElement('div'); d.className = 'm';
    const top = document.createElement('div'); top.className = 'tag';
    top.textContent = (m.name || 'Anonymous') + ' · ' + m.contact + ' · ' + new Date(m.at).toLocaleDateString();
    const body = document.createElement('p'); body.textContent = m.message;
    const x = document.createElement('button'); x.className = 'del'; x.textContent = 'Delete';
    x.onclick = async () => { await fetch('/api/messages/' + m.id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } }); inbox(); };
    d.append(top, body, x); box.append(d);
  }
}

$('msgform').onsubmit = async (e) => {
  e.preventDefault();
  const s = $('mstat'); s.textContent = 'Sending…';
  const r = await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: $('mn').value, contact: $('mc').value, message: $('mm').value, website: $('mw').value }) });
  const d = await r.json();
  s.textContent = r.ok ? 'Sent. Thank you!' : d.error;
  if (r.ok) e.target.reset();
};
$('toggle').onclick = () => { $('owner').hidden = !$('owner').hidden; show(); };
$('login').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
  const d = await r.json();
  if (!r.ok) return say(d.error);
  token = d.token; localStorage.setItem('token', token); $('pw').value = ''; say(''); show(); draw();
};
$('out').onclick = () => { token = ''; localStorage.removeItem('token'); show(); draw(); };
$('up').onsubmit = async (e) => {
  e.preventDefault();
  const file = $('file').files[0], f = new FormData();
  f.append('category', $('cat').value); f.append('title', $('title').value); f.append('book', file);
  say('Making cover…');
  try { f.append('cover', await makeCover(file), 'cover.jpg'); } catch (err) { /* upload without a cover */ }
  say('Uploading…');
  const r = await fetch('/api/books', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: f });
  const d = await r.json();
  say(r.ok ? 'Book added.' : d.error);
  if (r.ok) { $('up').reset(); load(); }
};
tabs(); load();
</script>
</body>
</html>
